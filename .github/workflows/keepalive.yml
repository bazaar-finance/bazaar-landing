name: Keepalive

# GitHub disables cron schedules in public repos after 60 days without repo
# activity — which would silently freeze the 5-minute price refresh. This
# checks weekly and pushes an empty commit once the repo has been quiet for
# 50 days, resetting the clock before either schedule can be disabled.
# (It fires at day ~50, so the 60-day cutoff is never reached — including
# for this workflow's own schedule.)

on:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit if the repo has been quiet for 50+ days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit was ${age_days} day(s) ago"
          if [ "$age_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled workflows alive"
            git push
          else
            echo "recent enough; nothing to do"
          fi
