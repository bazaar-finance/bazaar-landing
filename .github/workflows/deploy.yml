name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Refresh prices.json. Every 5 minutes is GitHub's floor, and scheduled
    # runs can lag several minutes under load — treat this as best-effort.
    # Sun-Fri: FX and WTI reopen Sunday evening UTC; only Saturday is dead.
    # The site keeps serving between runs regardless.
    - cron: "*/5 * * * 0-5"

permissions:
  contents: read
  pages: write
  id-token: write

# Never interrupt a deploy mid-flight; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Bake equity + WTI prices into the artifact (browsers can't call Yahoo
      # directly — no CORS). Never fails the deploy: on fetch trouble the script
      # falls back to the currently-live prices.json, and failing that the page
      # uses its seeded values.
      - name: Fetch equity and oil prices
        run: python3 scripts/fetch-prices.py

      - uses: actions/configure-pages@v5

      # No build step — the repo root is the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
